<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국 지하철 노선도 역명 편집기</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --input-bg: #0d1219;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.05rem; font-weight: 600; }
    header .badge {
      font-size: 0.68rem;
      background: #1e3a5f;
      color: #93c5fd;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .main { display: flex; flex: 1; min-height: 0; }

    /* Sidebar: actions always visible at bottom */
    .sidebar {
      width: 380px;
      max-width: 42vw;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      min-height: 0;
    }
    .sidebar-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .sidebar-section {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-actions {
      flex-shrink: 0;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: #152033;
      z-index: 20;
    }
    .sidebar-section h2 {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 4px;
      color: var(--muted);
    }
    textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      resize: vertical;
      line-height: 1.45;
      min-height: 140px;
      max-height: 35vh;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    .btn-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #2a3548; color: var(--text); }
    .btn-secondary:hover { background: #364156; }
    .btn-success { background: var(--success); color: #052e16; }
    .btn-success:hover { background: #16a34a; }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .help {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.45;
      margin-top: 6px;
    }
    .help code {
      background: #243044;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.7rem;
    }
    .stats { display: flex; gap: 10px; font-size: 0.78rem; color: var(--muted); }
    .stats strong { color: var(--text); }
    .status {
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-top: 8px;
      display: none;
    }
    .status.show { display: block; }
    .status.ok { background: rgba(34, 197, 94, 0.15); color: #86efac; }
    .status.err { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
    .status.info { background: rgba(59, 130, 246, 0.15); color: #93c5fd; }
    #changeList {
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--muted);
      max-height: 120px;
      overflow: auto;
      line-height: 1.4;
    }
    #fileInput { display: none; }

    /* Map */
    .map-area {
      flex: 1;
      position: relative;
      background: #e8edf5;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #svgContainer {
      flex: 1;
      min-height: 0;
      overflow: auto;
      cursor: grab;
      background: #f8fafc;
    }
    #svgContainer.grabbing { cursor: grabbing; }
    /* 확대해도 스크롤 영역이 잘리지 않도록: 실제 크기의 래퍼 */
    #svgWrap {
      display: inline-block;
      transform-origin: 0 0;
      background: #ffffff;
      line-height: 0;
      /* scale 후 레이아웃 공간은 JS에서 width/height로 맞춤 */
    }
    #svgWrap svg {
      display: block;
      width: 1200px;
      max-width: none;
      height: auto;
    }

    /* 지도 위 컨트롤 — 1세트만 */
    .map-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }
    .map-controls .row { display: flex; gap: 5px; }
    .map-controls button {
      background: rgba(26, 35, 50, 0.96);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      min-width: 38px;
      padding: 8px 11px;
    }
    .map-controls button:hover { background: #2a3548; }
    .map-controls .btn-dl {
      background: rgba(34, 197, 94, 0.95);
      color: #052e16;
      border-color: #16a34a;
      font-weight: 600;
      padding: 9px 14px;
    }
    .map-controls .btn-dl:hover { background: #16a34a; color: #fff; }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(248, 250, 252, 0.9);
      z-index: 40;
      color: #64748b;
    }
    .loading.hidden { display: none; }

    @media (max-width: 800px) {
      .main { flex-direction: column; }
      .sidebar {
        width: 100%;
        max-width: none;
        max-height: 48vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      textarea { min-height: 90px; max-height: 18vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>한국 지하철 노선도 역명 편집기</h1>
    <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--muted);margin:0;">
      도시
      <select id="citySelect" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:0.85rem;">
        <option value="seoul">수도권</option>
        <option value="busan">부산</option>
        <option value="daegu">대구</option>
        <option value="gwangju">광주</option>
        <option value="daejeon">대전</option>
      </select>
    </label>
    <span class="badge">SVG 편집 · 매핑 반영</span>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="sidebar-scroll">
        <div class="sidebar-section">
          <h2>역명 매핑</h2>
          <label for="mappingInput">한 줄에 하나씩 · <code>원래이름 = 새이름</code></label>
          <textarea id="mappingInput" placeholder="강남 = Gangnam
교대 = Gyodae
서울역 = Seoul Station

# 빈 값·#주석 무시"></textarea>
          <div class="help">
            형식: <code>A = B</code> · <code>A|B</code> · 탭 구분
          </div>
          <label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer;color:var(--text);">
            <input type="checkbox" id="chkShowKorean" checked style="width:auto;accent-color:var(--accent);" />
            외국어 아래에 <strong>한국어</strong>를 연한 색·작게 표시
          </label>
          <div id="status" class="status"></div>
        </div>

        <div class="sidebar-section">
          <h2>파일 / 예시</h2>
          <div class="btn-row">
            <button type="button" class="btn-secondary" id="btnLoadFile">CSV/JSON/TXT</button>
            <button type="button" class="btn-secondary" id="btnExampleEn">영어 예시</button>
            <button type="button" class="btn-secondary" id="btnClear">비우기</button>
          </div>
          <input type="file" id="fileInput" accept=".csv,.json,.txt,.tsv" />
        </div>

        <div class="sidebar-section">
          <h2>적용 결과</h2>
          <div class="stats">
            <span>매핑 <strong id="statMapped">0</strong></span>
            <span>변경 <strong id="statChanged">0</strong></span>
          </div>
          <div id="changeList"></div>
        </div>
      </div>

      <!-- 항상 보이는 하단 액션 (스크롤과 분리) -->
      <div class="sidebar-actions">
        <div class="btn-row" style="margin-top:0;">
          <button type="button" class="btn-primary" id="btnApply" style="flex:1;">지도에 반영</button>
          <button type="button" class="btn-secondary" id="btnPreview">미리보기</button>
          <button type="button" class="btn-danger" id="btnReset">원본</button>
        </div>
      </div>
    </aside>

    <div class="map-area">
      <div class="loading" id="loading">노선도 불러오는 중…</div>

      <!-- 다운로드 + 이동 + 줌 : 1세트만 -->
      <div class="map-controls">
        <div class="row">
          <button type="button" class="btn-dl" id="btnDownload" title="수정된 SVG 다운로드">⬇ 노선도 다운</button>
        </div>
        <div class="row">
          <button type="button" id="btnPanLeft" title="왼쪽">◀</button>
          <button type="button" id="btnPanUp" title="위">▲</button>
          <button type="button" id="btnPanDown" title="아래">▼</button>
          <button type="button" id="btnPanRight" title="오른쪽">▶</button>
        </div>
        <div class="row">
          <button type="button" id="btnZoomIn" title="확대">＋</button>
          <button type="button" id="btnZoomOut" title="축소">－</button>
          <button type="button" id="btnZoomFit" title="맞춤">맞춤</button>
        </div>
      </div>

      <div id="svgContainer">
        <div id="svgWrap"></div>
      </div>
    </div>
  </div>

  <script>
    let originalSvgString = null;
    let scale = 1;
    const MIN_SCALE = 0.25;
    const MAX_SCALE = 4;
    const BASE_SVG_WIDTH = 1200;

    const $ = (id) => document.getElementById(id);
    const mappingInput = $("mappingInput");
    const statusEl = $("status");
    const svgContainer = $("svgContainer");
    const svgWrap = $("svgWrap");
    const loading = $("loading");
    const fileInput = $("fileInput");

    function showStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = "status show " + (type || "info");
    }

    function normalize(s) {
      return String(s).replace(/\s+/g, "").toLowerCase();
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function parseMappings(text) {
      const map = new Map();
      String(text).split(/\r?\n/).forEach(function (raw) {
        var line = raw.trim();
        if (!line || line.charAt(0) === "#") return;
        var from = null, to = null;
        var m = line.match(/^(.+?)\s*[=|→]\s*(.*)$/);
        if (m) {
          from = m[1].trim();
          to = m[2].trim();
        } else {
          var parts = line.split(/\t+/);
          if (parts.length >= 2) {
            from = parts[0].trim();
            to = parts.slice(1).join("\t").trim();
          }
        }
        if (from && to) map.set(normalize(from), to);
      });
      return map;
    }

    async function loadSvg(cityKey) {
      cityKey = cityKey || ($("citySelect") && $("citySelect").value) || "seoul";
      var cfg = CITY_MAPS[cityKey] || CITY_MAPS.seoul;
      loading.classList.remove("hidden");
      loading.textContent = cfg.label + " 노선도 불러오는 중…";
      try {
        var svgText = null;

        // 1) 내장 SVG (광주/대전) — file:// 에서도 동작
        if (typeof EMBEDDED_MAPS !== "undefined" && EMBEDDED_MAPS[cityKey]) {
          svgText = EMBEDDED_MAPS[cityKey];
        }

        // 2) 같은 폴더 파일
        if (!svgText) {
          for (var i = 0; i < cfg.local.length; i++) {
            try {
              var res = await fetch(cfg.local[i]);
              if (res.ok) {
                svgText = await res.text();
                break;
              }
            } catch (e) {}
          }
        }

        // 3) 원격
        if (!svgText && cfg.remote) {
          var res2 = await fetch(cfg.remote);
          if (res2.ok) svgText = await res2.text();
        }

        if (!svgText) throw new Error("SVG를 찾을 수 없습니다. maps/ 폴더와 HTML을 함께 두세요.");

        originalSvgString = svgText;
        renderSvg(originalSvgString);
        loading.classList.add("hidden");
        $("statMapped").textContent = "0";
        $("statChanged").textContent = "0";
        $("changeList").innerHTML = "";
        var tcount = (svgText.match(/<text[\s>]/gi) || []).length;
        if (tcount < 5) {
          showStatus(cfg.label + " 한국어 노선도 로드 완료. (이 지도는 글자가 도형으로 되어 있어 역명 매핑 변경이 제한될 수 있습니다)", "info");
        } else {
          showStatus(cfg.label + " 로드 완료. 매핑 후 ‘지도에 반영’을 누르세요.", "ok");
        }
      } catch (e) {
        loading.textContent = cfg.label + " 노선도를 불러오지 못했습니다.";
        showStatus(String(e.message || e), "err");
      }
    }

    function renderSvg(svgString) {
      svgWrap.innerHTML = svgString;
      var svg = svgWrap.querySelector("svg");
      if (!svg) return;
      svg.removeAttribute("style");
      svg.style.display = "block";
      svg.style.width = BASE_SVG_WIDTH + "px";
      svg.style.maxWidth = "none";
      svg.style.height = "auto";
      svg.style.background = "#ffffff";
      // 배경이 비어 있으면 흰 rect 추가 (일부 SVG는 투명 배경)
      var hasBg = false;
      var first = svg.firstElementChild;
      if (first && first.tagName && first.tagName.toLowerCase() === "rect") hasBg = true;
      if (!hasBg) {
        var rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", "0");
        rect.setAttribute("y", "0");
        rect.setAttribute("width", "100%");
        rect.setAttribute("height", "100%");
        rect.setAttribute("fill", "#ffffff");
        svg.insertBefore(rect, svg.firstChild);
      }
      scale = 1;
      applyScale();
    }

    function applyScale() {
      var svg = svgWrap.querySelector("svg");
      if (!svg) return;
      // transform scale + 래퍼 크기를 맞춰 스크롤 영역이 잘리지 않게 함
      svgWrap.style.transform = "scale(" + scale + ")";
      var w = svg.offsetWidth || BASE_SVG_WIDTH;
      var h = svg.offsetHeight || 800;
      svgWrap.style.width = w + "px";
      svgWrap.style.height = h + "px";
      // 스케일된 시각 크기만큼 스크롤 가능 공간 확보
      svgWrap.style.marginRight = Math.max(0, w * (scale - 1)) + "px";
      svgWrap.style.marginBottom = Math.max(0, h * (scale - 1)) + "px";
    }

    function applyNames(previewOnly) {
      if (!originalSvgString) {
        showStatus("노선도가 아직 로드되지 않았습니다.", "err");
        return;
      }
      var mappings = parseMappings(mappingInput.value);
      if (mappings.size === 0) {
        showStatus("유효한 매핑이 없습니다. ‘원래이름 = 새이름’ 형식으로 입력하세요.", "err");
        return;
      }

      var parser = new DOMParser();
      var doc = parser.parseFromString(originalSvgString, "image/svg+xml");
      var texts = doc.querySelectorAll("text");
      var changedCount = 0;
      var changedList = [];
      var matchedKeys = new Set();
      var showKo = $("chkShowKorean") && $("chkShowKorean").checked;

      texts.forEach(function (textEl) {
        var full = (textEl.textContent || "").trim();
        if (!full) return;
        var key = normalize(full);
        if (!mappings.has(key)) return;
        var newName = mappings.get(key);
        matchedKeys.add(key);

        while (textEl.firstChild) textEl.removeChild(textEl.firstChild);
        var t1 = doc.createElementNS("http://www.w3.org/2000/svg", "tspan");
        t1.setAttribute("x", "0");
        t1.setAttribute("y", "0");
        t1.textContent = newName;
        textEl.appendChild(t1);

        if (showKo && full !== newName) {
          var t2 = doc.createElementNS("http://www.w3.org/2000/svg", "tspan");
          t2.setAttribute("x", "0");
          t2.setAttribute("dy", "1.15em");
          t2.setAttribute("fill", "#6b7280");
          t2.setAttribute("font-size", "0.72em");
          t2.setAttribute("opacity", "0.85");
          t2.textContent = full;
          textEl.appendChild(t2);
        }
        changedCount++;
        changedList.push(full + " → " + newName);
      });

      var unmatched = [];
      mappings.forEach(function (_v, k) {
        if (!matchedKeys.has(k)) unmatched.push(k);
      });

      $("statMapped").textContent = String(mappings.size);
      $("statChanged").textContent = String(changedCount);
      var listHtml = changedList.slice(0, 50).map(function (s) {
        return "<div>" + escapeHtml(s) + "</div>";
      }).join("");
      if (changedList.length > 50) listHtml += "<div>… 외 " + (changedList.length - 50) + "개</div>";
      if (unmatched.length) {
        listHtml += '<div style="margin-top:6px;color:#fca5a5;">미매칭 ' + unmatched.length + "개</div>";
      }
      $("changeList").innerHTML = listHtml;

      if (previewOnly) {
        showStatus("미리보기: 변경 " + changedCount + "개", unmatched.length ? "info" : "ok");
        return;
      }

      var newSvg = new XMLSerializer().serializeToString(doc);
      renderSvg(newSvg);
      showStatus(
        changedCount
          ? changedCount + "개 텍스트가 지도에 반영되었습니다."
          : "매칭된 역명이 없습니다.",
        changedCount ? "ok" : "err"
      );
    }

    function resetToOriginal() {
      if (!originalSvgString) return;
      renderSvg(originalSvgString);
      $("statMapped").textContent = "0";
      $("statChanged").textContent = "0";
      $("changeList").innerHTML = "";
      showStatus("원본으로 복원되었습니다.", "info");
    }

    function downloadSvg() {
      var svg = svgWrap.querySelector("svg");
      if (!svg) {
        showStatus("다운로드할 노선도가 없습니다.", "err");
        return;
      }
      var clone = svg.cloneNode(true);
      clone.removeAttribute("style");
      var str = new XMLSerializer().serializeToString(clone);
      var blob = new Blob([str], { type: "image/svg+xml;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      var city = ($("citySelect") && $("citySelect").value) || "map";
      a.download = city + "-subway-map-custom.svg";
      a.click();
      URL.revokeObjectURL(url);
      showStatus("SVG를 다운로드했습니다.", "ok");
    }

    function loadFromFile(file) {
      var reader = new FileReader();
      reader.onload = function () {
        var text = reader.result;
        var name = (file.name || "").toLowerCase();
        try {
          if (name.endsWith(".json")) {
            var data = JSON.parse(text);
            var lines = [];
            if (data.mapping_template) {
              Object.keys(data.mapping_template).forEach(function (k) {
                if (data.mapping_template[k]) lines.push(k + " = " + data.mapping_template[k]);
              });
            } else if (Array.isArray(data.stations)) {
              lines = data.stations.map(function (s) { return s + " = "; });
            }
            mappingInput.value = lines.join("\n");
          } else if (name.endsWith(".csv") || name.endsWith(".tsv")) {
            var sep = name.endsWith(".tsv") ? "\t" : ",";
            var rows = text.split(/\r?\n/).filter(Boolean);
            var header = rows[0].split(sep).map(function (h) {
              return h.replace(/^\uFEFF/, "").trim();
            });
            var ni = header.findIndex(function (h) { return /역명|station|name/i.test(h); });
            var ei = header.findIndex(function (h) { return /영어|english|eng|새이름|new/i.test(h); });
            var start = ni >= 0 ? 1 : 0;
            ni = ni >= 0 ? ni : 0;
            ei = ei >= 0 ? ei : 1;
            var out = [];
            for (var i = start; i < rows.length; i++) {
              var cols = rows[i].split(sep).map(function (c) {
                return c.trim().replace(/^"|"$/g, "");
              });
              if (cols[ni]) out.push(cols[ni] + " = " + (cols[ei] || ""));
            }
            mappingInput.value = out.join("\n");
          } else {
            mappingInput.value = text;
          }
          showStatus("파일을 불러왔습니다.", "ok");
        } catch (e) {
          showStatus("파일 파싱 실패: " + e.message, "err");
        }
      };
      reader.readAsText(file, "UTF-8");
    }

    var EXAMPLE_EN = "강남 = Gangnam\n교대 = Gyodae\n서울역 = Seoul Station\n홍대입구 = Hongik Univ.\n건대입구 = Konkuk Univ.\n고속터미널 = Express Bus Terminal\n잠실 = Jamsil\n여의도 = Yeouido\n시청 = City Hall\n종로3가 = Jongno 3-ga\n신촌 = Sinchon\n이태원 = Itaewon\n명동 = Myeongdong\n사당 = Sadang\n노원 = Nowon\n왕십리 = Wangsimni\n합정 = Hapjeong\n공덕 = Gongdeok\n신도림 = Sindorim\n선릉 = Seolleung\n역삼 = Yeoksam\n삼성 = Samseong\n광화문 = Gwanghwamun\n경복궁 = Gyeongbokgung\n";

    $("btnApply").addEventListener("click", function () { applyNames(false); });
    $("btnPreview").addEventListener("click", function () { applyNames(true); });
    $("btnReset").addEventListener("click", resetToOriginal);
    $("btnDownload").addEventListener("click", downloadSvg);
    $("btnClear").addEventListener("click", function () {
      mappingInput.value = "";
      showStatus("입력창을 비웠습니다.", "info");
    });
    $("btnExampleEn").addEventListener("click", function () {
      mappingInput.value = EXAMPLE_EN;
      showStatus("영어 예시를 불러왔습니다.", "info");
    });
    $("btnLoadFile").addEventListener("click", function () { fileInput.click(); });
    fileInput.addEventListener("change", function () {
      if (fileInput.files && fileInput.files[0]) {
        loadFromFile(fileInput.files[0]);
        fileInput.value = "";
      }
    });

    function panBy(dx, dy) {
      svgContainer.scrollLeft += dx;
      svgContainer.scrollTop += dy;
    }
    $("btnPanLeft").addEventListener("click", function () { panBy(-140, 0); });
    $("btnPanRight").addEventListener("click", function () { panBy(140, 0); });
    $("btnPanUp").addEventListener("click", function () { panBy(0, -140); });
    $("btnPanDown").addEventListener("click", function () { panBy(0, 140); });

    $("btnZoomIn").addEventListener("click", function () {
      scale = Math.min(MAX_SCALE, scale + 0.15);
      applyScale();
    });
    $("btnZoomOut").addEventListener("click", function () {
      scale = Math.max(MIN_SCALE, scale - 0.15);
      applyScale();
    });
    $("btnZoomFit").addEventListener("click", function () {
      scale = 1;
      applyScale();
      svgContainer.scrollTo(0, 0);
    });

    // drag pan
    var isDragging = false, startX, startY, scrollLeft, scrollTop;
    svgContainer.addEventListener("mousedown", function (e) {
      if (e.button !== 0) return;
      isDragging = true;
      svgContainer.classList.add("grabbing");
      startX = e.clientX;
      startY = e.clientY;
      scrollLeft = svgContainer.scrollLeft;
      scrollTop = svgContainer.scrollTop;
    });
    window.addEventListener("mouseup", function () {
      isDragging = false;
      svgContainer.classList.remove("grabbing");
    });
    window.addEventListener("mousemove", function (e) {
      if (!isDragging) return;
      e.preventDefault();
      svgContainer.scrollLeft = scrollLeft - (e.clientX - startX);
      svgContainer.scrollTop = scrollTop - (e.clientY - startY);
    });

    // touch
    var tx0, ty0, tsl, tst;
    svgContainer.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) return;
      tx0 = e.touches[0].clientX;
      ty0 = e.touches[0].clientY;
      tsl = svgContainer.scrollLeft;
      tst = svgContainer.scrollTop;
    }, { passive: true });
    svgContainer.addEventListener("touchmove", function (e) {
      if (e.touches.length !== 1) return;
      svgContainer.scrollLeft = tsl - (e.touches[0].clientX - tx0);
      svgContainer.scrollTop = tst - (e.touches[0].clientY - ty0);
    }, { passive: true });

    // wheel: shift=가로, ctrl=줌
    svgContainer.addEventListener("wheel", function (e) {
      if (e.ctrlKey) {
        e.preventDefault();
        scale = e.deltaY < 0
          ? Math.min(MAX_SCALE, scale + 0.1)
          : Math.max(MIN_SCALE, scale - 0.1);
        applyScale();
      } else if (e.shiftKey) {
        e.preventDefault();
        svgContainer.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    window.addEventListener("keydown", function (e) {
      if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
      var step = e.shiftKey ? 220 : 120;
      if (e.key === "ArrowLeft") { e.preventDefault(); panBy(-step, 0); }
      else if (e.key === "ArrowRight") { e.preventDefault(); panBy(step, 0); }
      else if (e.key === "ArrowUp") { e.preventDefault(); panBy(0, -step); }
      else if (e.key === "ArrowDown") { e.preventDefault(); panBy(0, step); }
    });

    mappingInput.addEventListener("keydown", function (e) {
      if (e.ctrlKey && e.key === "Enter") {
        e.preventDefault();
        applyNames(false);
      }
    });

    $("citySelect").addEventListener("change", function () {
      loadSvg($("citySelect").value);
    });

    loadSvg("seoul");
  </script>
</body>
</html>
